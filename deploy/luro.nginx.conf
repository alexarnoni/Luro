server {
    listen 80;
    server_name luro.seu-dominio.com;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Security headers managed at the proxy layer.
    # NOTE: Content-Security-Policy is intentionally omitted here — it is set
    # exclusively by the FastAPI application so that only one CSP header reaches
    # the browser.  Sending two CSP headers causes browsers to apply the most
    # restrictive intersection, which breaks the application.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /static/ {
        alias /opt/luro/app/web/static/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        # Defense-in-depth: also set Cache-Control for dynamic responses in case
        # the application layer does not set it (e.g. unhandled error pages).
        # When FastAPI has already set the header the browser receives it twice
        # with the same value, which is harmless.
        add_header Cache-Control "no-store" always;
    }
}
